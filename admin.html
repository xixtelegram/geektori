<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>پنل مدیریت فروش | گیکتوری</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/app.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Vazirmatn', 'Tahoma', 'system-ui', 'sans-serif'] },
          colors: {
            brand: { 50:'#f0f9ff',100:'#e0f2fe',200:'#bae6fd',300:'#7dd3fc',400:'#38bdf8',500:'#0ea5e9',600:'#0284c7',700:'#0369a1',800:'#075985',900:'#0c4a6e' }
          }
        }
      }
    }
  </script>
</head>
<body class="text-slate-800 min-h-screen">

  <div id="loginScreen" class="min-h-screen flex items-center justify-center px-4">
    <div class="glass-strong rounded-[28px] p-8 w-full max-w-md">
      <div class="text-center mb-6">
        <div class="text-4xl mb-2">🔐</div>
        <h1 class="text-xl font-bold">پنل مدیریت فروش</h1>
        <p class="text-sm text-slate-500 mt-1">ورود با توکن گیت‌هاب</p>
      </div>
      <div class="space-y-4">
        <div>
          <label class="text-xs font-medium text-slate-500 mb-1 block">GitHub Token</label>
          <input type="password" id="loginToken" placeholder="ghp_... یا github_pat_..." class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400" />
        </div>
        <div>
          <label class="text-xs font-medium text-slate-500 mb-1 block">کلید رمزنگاری (همان ENCRYPTION_KEY ورکر)</label>
          <input type="password" id="loginKey" placeholder="کلید مشترک با Worker" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-medium text-slate-500 mb-1 block">Owner</label>
            <input type="text" id="loginOwner" value="xixtelegram" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400" />
          </div>
          <div>
            <label class="text-xs font-medium text-slate-500 mb-1 block">Repo</label>
            <input type="text" id="loginRepo" value="geektori" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400" />
          </div>
        </div>
        <p id="loginError" class="text-rose-600 text-sm hidden"></p>
        <button id="loginBtn" class="btn-ios w-full py-2.5">ورود</button>
      </div>
    </div>
  </div>

  <div id="appScreen" class="hidden">
    <header class="glass-header sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <span class="text-xl">🏷️</span>
          <div>
            <h1 class="font-bold text-lg leading-tight tracking-tight">پنل مدیریت فروش</h1>
            <p class="text-xs text-ios-secondary" id="repoLabel">—</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button data-view="overview" class="nav-btn bg-black/5 px-3 py-1.5 text-sm font-semibold text-slate-800">نمای کلی</button>
          <button data-view="designers" class="nav-btn bg-transparent hover:bg-black/5 px-3 py-1.5 text-sm text-slate-600">طراح‌ها</button>
          <button data-view="compare" class="nav-btn bg-transparent hover:bg-black/5 px-3 py-1.5 text-sm text-slate-600">مقایسه</button>
          <button id="refreshBtn" class="nav-btn bg-transparent hover:bg-black/5 px-3 py-1.5 text-sm text-slate-600">بروزرسانی</button>
          <button id="logoutBtn" class="nav-btn bg-transparent hover:bg-black/5 px-3 py-1.5 text-sm text-slate-600">خروج</button>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
      <div id="loadingBar" class="hidden text-center text-sm text-slate-500 py-8">در حال بارگذاری...</div>

      <section id="view-overview" class="space-y-6">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3" id="overviewKpis"></div>
        <div class="glass-card overflow-hidden">
          <div class="px-4 py-3 border-b border-slate-100 font-bold text-sm">آخرین آپلودها</div>
          <div class="overflow-x-auto scrollbar" id="uploadsTable"></div>
        </div>
      </section>

      <section id="view-designers" class="hidden space-y-4">
        <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3" id="designerCards"></div>
        <div id="designerDetail" class="hidden bg-white rounded-2xl border border-slate-100 shadow-sm p-4 space-y-4">
          <div class="flex items-center justify-between gap-2 flex-wrap">
            <h2 class="font-bold text-lg" id="designerTitle">—</h2>
            <button id="closeDesigner" class="text-sm text-slate-500 underline">بستن</button>
          </div>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3" id="designerKpis"></div>
          <div class="grid md:grid-cols-2 gap-4">
            <div class="border border-slate-100 rounded-xl p-3">
              <h3 class="text-sm font-bold mb-2">فروش هر فصل</h3>
              <div class="h-48"><canvas id="designerSeasonChart"></canvas></div>
            </div>
            <div class="border border-slate-100 rounded-xl p-3">
              <h3 class="text-sm font-bold mb-2">فایل‌های طراح</h3>
              <div id="designerFiles" class="space-y-2 max-h-48 overflow-y-auto scrollbar text-sm"></div>
            </div>
          </div>
          <div>
            <h3 class="text-sm font-bold mb-2">جزئیات محصولات (فصل انتخاب‌شده)</h3>
            <select id="designerSeasonSelect" class="border border-slate-200 rounded-xl px-3 py-2 text-sm mb-3"></select>
            <div class="overflow-x-auto scrollbar max-h-[40vh] border border-slate-100 rounded-xl" id="designerProducts"></div>
          </div>
        </div>
      </section>

      <section id="view-compare" class="hidden space-y-4">
        <div class="glass-card p-4">
          <div class="flex flex-wrap gap-3 items-end">
            <div>
              <label class="text-xs text-slate-500 block mb-1">فصل</label>
              <select id="compareSeason" class="border border-slate-200 rounded-xl px-3 py-2 text-sm min-w-[140px]"></select>
            </div>
            <div class="flex-1 min-w-[200px]">
              <label class="text-xs text-slate-500 block mb-1">طراح‌ها (چندتایی با Ctrl/Cmd)</label>
              <select id="compareDesigners" multiple class="border border-slate-200 rounded-xl px-3 py-2 text-sm w-full h-28"></select>
            </div>
            <button id="runCompare" class="btn-ios text-sm px-4 py-2">مقایسه</button>
          </div>
        </div>
        <div class="grid md:grid-cols-2 gap-4">
          <div class="glass-card p-4">
            <h3 class="text-sm font-bold mb-2">تعداد فروش</h3>
            <div class="h-56"><canvas id="compareQtyChart"></canvas></div>
          </div>
          <div class="glass-card p-4">
            <h3 class="text-sm font-bold mb-2">درآمد</h3>
            <div class="h-56"><canvas id="compareRevChart"></canvas></div>
          </div>
        </div>
        <div class="glass-card overflow-hidden">
          <div class="px-4 py-3 border-b border-slate-100 font-bold text-sm">جدول مقایسه</div>
          <div class="overflow-x-auto scrollbar" id="compareTable"></div>
        </div>
      </section>
    </main>
  </div>

<script type="module" src="assets/js/admin/main.js"></script>
</body>
</html>
