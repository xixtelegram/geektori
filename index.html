<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>گیکتوری | ورود طراح</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Vazir', 'Tahoma', 'system-ui', 'sans-serif'] },
          colors: {
            brand: { 50:'#f0f9ff',100:'#e0f2fe',200:'#bae6fd',300:'#7dd3fc',400:'#38bdf8',500:'#0ea5e9',600:'#0284c7',700:'#0369a1',800:'#075985',900:'#0c4a6e' }
          }
        }
      }
    }
  </script>
</head>
<body class="text-slate-800 min-h-screen">

  <div class="min-h-screen flex flex-col items-center justify-center px-4 py-10">
    <div class="text-center mb-8">
      <div class="text-5xl mb-3">🏷️</div>
      <h1 class="text-2xl font-bold tracking-tight">گیکتوری</h1>
      <p class="text-sm text-slate-500 mt-1">پنل فروش طراحان استیکر</p>
    </div>

    <div class="glass-strong rounded-[28px] p-6 w-full max-w-md space-y-4">
      <!-- تب‌ها -->
      <div class="flex rounded-2xl bg-black/5 p-1 gap-1">
        <button type="button" data-tab="login" class="tab-btn flex-1 py-2 text-sm font-semibold rounded-xl bg-white shadow-sm">ورود</button>
        <button type="button" data-tab="register" class="tab-btn flex-1 py-2 text-sm font-medium rounded-xl text-slate-600">ساخت حساب</button>
        <button type="button" data-tab="recover" class="tab-btn flex-1 py-2 text-sm font-medium rounded-xl text-slate-600">بازیابی</button>
      </div>

      <!-- ورود -->
      <form id="formLogin" class="space-y-3">
        <div>
          <label class="text-xs font-medium text-slate-500 mb-1 block">نام کاربری (نام طراح)</label>
          <input type="text" id="loginName" autocomplete="username" required
            class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400" placeholder="مثلاً XIXnight" />
        </div>
        <div>
          <label class="text-xs font-medium text-slate-500 mb-1 block">رمز عبور</label>
          <input type="password" id="loginPass" autocomplete="current-password" required
            class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400" />
        </div>
        <p id="loginErr" class="text-rose-600 text-sm hidden"></p>
        <button type="submit" class="btn-ios w-full py-2.5">ورود به پنل</button>
      </form>

      <!-- ثبت‌نام -->
      <form id="formRegister" class="space-y-3 hidden">
        <div>
          <label class="text-xs font-medium text-slate-500 mb-1 block">نام طراح (همان نام فایل‌های فروش)</label>
          <input type="text" id="regName" required
            class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400" placeholder="مثلاً XIXnight" />
        </div>
        <div>
          <label class="text-xs font-medium text-slate-500 mb-1 block">رمز عبور</label>
          <input type="password" id="regPass" minlength="6" required
            class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400" />
        </div>
        <div>
          <label class="text-xs font-medium text-slate-500 mb-1 block">تکرار رمز</label>
          <input type="password" id="regPass2" minlength="6" required
            class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400" />
        </div>
        <p id="regErr" class="text-rose-600 text-sm hidden"></p>
        <button type="submit" class="btn-ios w-full py-2.5">ایجاد حساب</button>
      </form>

      <!-- بازیابی با کد یک‌بارمصرف -->
      <form id="formRecover" class="space-y-3 hidden">
        <div>
          <label class="text-xs font-medium text-slate-500 mb-1 block">نام کاربری</label>
          <input type="text" id="recName" required
            class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400" />
        </div>
        <div>
          <label class="text-xs font-medium text-slate-500 mb-1 block">رمز یک‌بارمصرف (XXXX-XXXX)</label>
          <input type="text" id="recCode" required placeholder="مثلاً ABCD-EFGH"
            class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400 font-mono tracking-wider" />
        </div>
        <div>
          <label class="text-xs font-medium text-slate-500 mb-1 block">رمز عبور جدید</label>
          <input type="password" id="recNewPass" minlength="6" required
            class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400" />
        </div>
        <p id="recErr" class="text-rose-600 text-sm hidden"></p>
        <button type="submit" class="btn-ios w-full py-2.5">بازنشانی رمز</button>
      </form>
    </div>

    <!-- نمایش کدهای بازیابی بعد از ثبت‌نام -->
    <div id="recoveryBox" class="hidden glass-strong rounded-[28px] p-6 w-full max-w-md mt-4 space-y-3">
      <h2 class="font-bold text-center">🔐 کدهای بازیابی (یک‌بارمصرف)</h2>
      <p class="text-xs text-slate-500 text-center">این ۴ کد را در جای امن ذخیره کنید. هر کد فقط یک بار قابل استفاده است.</p>
      <ul id="recoveryList" class="space-y-2 font-mono text-center text-sm"></ul>
      <button id="goToPanel" class="btn-ios w-full py-2.5">ورود به پنل طراح</button>
    </div>

    <p class="text-xs text-slate-400 mt-6 text-center">
      <a href="admin.html" class="underline hover:text-slate-600">ورود ادمین</a>
    </p>
  </div>

  <script type="module" src="js/auth/landing.js"></script>
</body>
</html>
