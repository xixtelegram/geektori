<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Vazirmatn', 'Tahoma', 'system-ui', 'sans-serif'] },
          colors: {
            brand: { 50:'#f0f9ff',100:'#e0f2fe',200:'#bae6fd',300:'#7dd3fc',400:'#38bdf8',500:'#0ea5e9',600:'#0284c7',700:'#0369a1',800:'#075985',900:'#0c4a6e' }
          }

  </script>
  <style>
    body { font-family: 'Vazirmatn', Tahoma, system-ui, sans-serif; }
    .card { transition: all 0.2s ease; }
    .card:hover { transform: translateY(-2px); box-shadow: 0 12px 24px -8px rgba(0,0,0,0.12); }
    .table-row:hover { background: #f0f9ff; }

<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- Upload Zone -->

        انتخاب فایل
        <input type="file" id="fileInput2" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" class="hidden" />

  <!-- Main Dashboard -->
  <main id="dashboard" class="hidden max-w-7xl mx-auto px-4 py-6 space-y-6">

    <!-- KPI Cards -->
    <section class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3" id="kpiCards"></section>

    <!-- Charts -->
    <section class="grid md:grid-cols-2 gap-4">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4">
        <h3 class="font-bold text-slate-700 mb-3 text-sm">۱۰ محصول پرفروش (تعداد)</h3>
        <div class="h-56"><canvas id="chartQty"></canvas></div>

        <h3 class="font-bold text-slate-700 mb-3 text-sm">۱۰ محصول پردرآمد (مبلغ)</h3>
        <div class="h-56"><canvas id="chartRev"></canvas></div>

    <!-- Filters -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4">
      <div class="flex flex-wrap gap-3 items-end">

        </div>
        <div>
          <label class="text-xs font-medium text-slate-500 mb-1 block">سایز</label>
          <select id="filterSize" class="border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400 min-w-[110px]">
            <option value="">همه</option>

        <div>

            <label class="text-xs font-medium text-slate-500 mb-1 block">حداکثر قیمت</label>
            <input type="number" id="maxPrice" placeholder="∞" class="w-28 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400" />
          </div>
          <div>
            <label class="text-xs font-medium text-slate-500 mb-1 block">مرتب‌سازی</label>
            <select id="sortBy" class="border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400">
              <option value="qty-desc">پرفروش‌ترین</option>
              <option value="rev-desc">پردرآمدترین</option>
              <option value="price-desc">گران‌ترین</option>
              <option value="price-asc">ارزان‌ترین</option>
              <option value="name-asc">نام (الفبا)</option>
              <option value="variants-desc">بیشترین واریانت</option>

    <!-- Results count + Export -->
    <div class="flex flex-wrap items-center justify-between gap-2 text-sm text-slate-500">
      <span id="resultCount">—</span>
      <div class="flex items-center gap-3">
        <button id="exportCsvBtn" class="text-brand-600 hover:text-brand-800 font-medium text-sm flex items-center gap-1">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
          CSV
        </button>
        <button id="exportXlsxBtn" class="text-brand-600 hover:text-brand-800 font-medium text-sm flex items-center gap-1">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
          Excel

    <!-- Data Table -->

  <footer class="py-6"></footer>

<script>
// ========== State ==========
let rawRows = [];
let products = [];
let currentView = 'grouped';
let chartQty = null, chartRev = null;

// ========== Helpers ==========
const fmt = (n) => new Intl.NumberFormat('fa-IR').format(n || 0);
const fmtMoney = (n) => fmt(n) + ' تومان';

function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function parseAttr(str, keyHint) {
  if (!str || str === 'NaN' || str === 'null') return null;
  const s = String(str).trim();
  if (s.includes('=')) {
    const parts = s.split(',').map(p => p.trim());
    for (const p of parts) {
      if (p.includes(keyHint) || keyHint === '') {
        return p.split('=').pop().trim();
      }
    }
    return s.split('=').pop().trim();
  }
  return s;
}

function extractMaterial(v1) {
  if (!v1) return '—';
  const s = String(v1);
  if (s.includes('جنس محصول')) return parseAttr(s, 'جنس') || '—';
  if (s.includes('نوع برش')) return 'برش';
  if (s.includes('زبان')) return 'کیبورد';
  if (s.includes('ابعاد')) return 'سایز خاص';
  return parseAttr(s, '') || s;
}

function extractSize(v1, v2) {
  if (v1 && String(v1).includes('نوع برش')) {
    return parseAttr(v1, 'برش') || '—';
  }
  if (v1 && String(v1).includes('زبان')) {
    return parseAttr(v1, 'زبان') || parseAttr(v1, '') || '—';
  }
  if (v2 && String(v2).includes('ابعاد')) return parseAttr(v2, 'ابعاد') || '—';
  if (v1 && String(v1).includes('ابعاد')) return parseAttr(v1, 'ابعاد') || '—';
  if (v2) return String(v2).trim();
  return '—';
}

function cleanName(name) {
  return String(name || '').trim();
}

function showLoading(show) {
  document.getElementById('loadingOverlay').classList.toggle('hidden', !show);
  document.getElementById('loadingOverlay').classList.toggle('flex', show);
}

function showError(msg) {
  alert(msg);
}

// ========== Parse Excel ==========
function parseWorkbook(wb, fileLabel) {
  const sheetName = wb.SheetNames[0];
  const sheet = wb.Sheets[sheetName];
  const data = XLSX.utils.sheet_to_json(sheet, { defval: '' });

  if (!data.length) {
    showError('فایل خالی است یا هیچ ردیفی ندارد.');
    return;
  }

  const keys = Object.keys(data[0]);
  const colMap = {};
  keys.forEach(k => {
    const kl = String(k).toLowerCase();
    if (k.includes('استیکر') || kl.includes('product') || (kl.includes('name') && !colMap.name)) colMap.name = k;
    else if (kl.includes('variant id') || k === 'id' || k.includes('variant id')) colMap.id = k;
    else if (k.includes('variant 1') || k.includes('جنس')) colMap.v1 = k;
    else if (k.includes('variant 2') || k.includes('ابعاد')) colMap.v2 = k;
    else if (k.includes('تعداد فروش') || kl.includes('qty') || kl.includes('quantity') || (kl.includes('sales') && !colMap.qty)) colMap.qty = k;
    else if (k.includes('قیمت') || kl === 'price') colMap.price = k;
    else if (k.includes('مجموع') && !k.includes('تعداد') && !k.includes('مبلغ') && !colMap.total) colMap.total = k;
  });

  // Fallbacks
  if (!colMap.name) colMap.name = keys.find(k => k.includes('استیکر')) || 'استیکر';
  if (!colMap.v1) colMap.v1 = keys.find(k => k.toLowerCase().includes('variant 1')) || 'variant 1 attributes';
  if (!colMap.v2) colMap.v2 = keys.find(k => k.toLowerCase().includes('variant 2')) || 'variant 2 attributes';
  if (!colMap.qty) colMap.qty = keys.find(k => k.includes('تعداد فروش')) || 'تعداد فروش فصل';
  if (!colMap.price) colMap.price = keys.find(k => k.includes('قیمت')) || 'قیمت';
  if (!colMap.total) colMap.total = keys.find(k => k === 'مجموع') || 'مجموع';
  if (!colMap.id) colMap.id = keys.find(k => k.toLowerCase().includes('variant id')) || 'variant id';

  // Validate required
  const sample = data[0];
  if (sample[colMap.name] === undefined) {
    showError('ستون‌های مورد نیاز پیدا نشد.\nحداقل ستون «استیکر» (یا نام محصول) لازم است.\nستون‌های موجود: ' + keys.join('، '));
    return;
  }

  rawRows = data.map((r, i) => {
    const name = cleanName(r[colMap.name]);
    if (!name) return null;
    const qty = Number(r[colMap.qty]) || 0;
    const price = Number(r[colMap.price]) || 0;
    let total = Number(r[colMap.total]);
    if (!total && qty && price) total = qty * price;
    return {
      idx: i,
      id: r[colMap.id] || i,
      name,
      material: extractMaterial(r[colMap.v1]),
      size: extractSize(r[colMap.v1], r[colMap.v2]),
      qty,
      price,
      total: total || 0,
      rawV1: r[colMap.v1],
      rawV2: r[colMap.v2]
    };
  }).filter(Boolean);

  if (!rawRows.length) {
    showError('هیچ محصول معتبری در فایل پیدا نشد.');
    return;
  }

  // Group by product name
  const map = new Map();
  rawRows.forEach(row => {
    if (!map.has(row.name)) {
      map.set(row.name, {
        name: row.name,
        variants: [],
        totalQty: 0,
        totalRev: 0,
        maxPrice: 0,
        minPrice: Infinity,
        materials: new Set(),
        sizes: new Set()
      });
    }
    const p = map.get(row.name);
    p.variants.push(row);
    p.totalQty += row.qty;
    p.totalRev += row.total;
    if (row.price > 0) {
      p.maxPrice = Math.max(p.maxPrice, row.price);
      p.minPrice = Math.min(p.minPrice, row.price);
    }
    if (row.material && row.material !== '—') p.materials.add(row.material);
    if (row.size && row.size !== '—') p.sizes.add(row.size);
  });

  products = Array.from(map.values()).map(p => {
    if (p.minPrice === Infinity) p.minPrice = 0;
    p.materials = Array.from(p.materials);
    p.sizes = Array.from(p.sizes);
    return p;
  });

  document.getElementById('fileName').textContent = fileLabel || 'فایل بارگذاری‌شده';
  buildFilters();
  renderAll();
  document.getElementById('uploadZone').classList.add('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
}

// ========== Filters UI ==========
function buildFilters() {
  const mats = new Set();
  const sizes = new Set();
  rawRows.forEach(r => {
    if (r.material && r.material !== '—') mats.add(r.material);
    if (r.size && r.size !== '—') sizes.add(r.size);
  });

  const matSel = document.getElementById('filterMaterial');
  matSel.innerHTML = '<option value="">همه</option>';
  [...mats].sort((a,b) => a.localeCompare(b, 'fa')).forEach(m => {
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    matSel.appendChild(opt);
  });

  const sizeSel = document.getElementById('filterSize');
  sizeSel.innerHTML = '<option value="">همه</option>';
  const sizeOrder = (s) => {
    if (s.includes('۳')) return 1;
    if (s.includes('۵')) return 2;
    if (s.includes('۷')) return 3;
    if (s.includes('۱۰')) return 4;
    if (s.includes('A5')) return 5;
    if (s.includes('A4')) return 6;
    if (s.includes('simple') || s === 'A') return 7;
    return 10;
  };
  [...sizes].sort((a,b) => sizeOrder(a) - sizeOrder(b) || a.localeCompare(b, 'fa')).forEach(s => {
    const opt = document.createElement('option');
    opt.value = s;
    opt.textContent = s;
    sizeSel.appendChild(opt);
  });
}

// ========== Filtering & Sorting ==========
function getFilteredProducts() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const mat = document.getElementById('filterMaterial').value;
  const size = document.getElementById('filterSize').value;
  const minP = Number(document.getElementById('minPrice').value) || 0;
  const maxP = Number(document.getElementById('maxPrice').value) || Infinity;
  const onlySold = document.getElementById('onlySold').checked;
  const sortBy = document.getElementById('sortBy').value;

  let list = products.map(p => {
    let vars = p.variants.filter(v => {
      if (onlySold && v.qty === 0) return false;
      if (mat && v.material !== mat) return false;
      if (size && v.size !== size) return false;
      if (v.price < minP || (v.price > maxP && maxP !== Infinity)) return false;
      return true;
    });
    if (q && !p.name.toLowerCase().includes(q)) return null;
    if (vars.length === 0 && (mat || size || onlySold || minP || maxP < Infinity)) return null;

    const totalQty = vars.reduce((s,v) => s + v.qty, 0);
    const totalRev = vars.reduce((s,v) => s + v.total, 0);
    const maxPrice = Math.max(...vars.map(v => v.price), 0);
    const minPrice = Math.min(...vars.filter(v => v.price > 0).map(v => v.price), Infinity) || 0;

    return { ...p, variants: vars, totalQty, totalRev, maxPrice, minPrice: minPrice === Infinity ? 0 : minPrice };
  }).filter(Boolean);

  list.sort((a, b) => {
    switch (sortBy) {
      case 'qty-desc': return b.totalQty - a.totalQty;
      case 'rev-desc': return b.totalRev - a.totalRev;
      case 'price-desc': return b.maxPrice - a.maxPrice;
      case 'price-asc': return a.minPrice - b.minPrice || a.maxPrice - b.maxPrice;
      case 'name-asc': return a.name.localeCompare(b.name, 'fa');
      case 'variants-desc': return b.variants.length - a.variants.length;
      default: return b.totalQty - a.totalQty;
    }
  });

  return list;
}

function getFilteredFlat() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const mat = document.getElementById('filterMaterial').value;
  const size = document.getElementById('filterSize').value;
  const minP = Number(document.getElementById('minPrice').value) || 0;
  const maxP = Number(document.getElementById('maxPrice').value) || Infinity;
  const onlySold = document.getElementById('onlySold').checked;
  const sortBy = document.getElementById('sortBy').value;

  let list = rawRows.filter(v => {
    if (onlySold && v.qty === 0) return false;
    if (mat && v.material !== mat) return false;
    if (size && v.size !== size) return false;
    if (v.price < minP || (v.price > maxP && maxP !== Infinity)) return false;
    if (q && !v.name.toLowerCase().includes(q)) return false;
    return true;
  });

  list.sort((a, b) => {
    switch (sortBy) {
      case 'qty-desc': return b.qty - a.qty;
      case 'rev-desc': return b.total - a.total;
      case 'price-desc': return b.price - a.price;
      case 'price-asc': return a.price - b.price;
      case 'name-asc': return a.name.localeCompare(b.name, 'fa');
      default: return b.qty - a.qty;
    }
  });

  return list;
}

// ========== Render ==========
function renderKPIs() {
  const totalProducts = products.length;
  const totalVariants = rawRows.length;
  const soldVariants = rawRows.filter(r => r.qty > 0).length;
  const totalQty = rawRows.reduce((s,r) => s + r.qty, 0);
  const totalRev = rawRows.reduce((s,r) => s + r.total, 0);

  const cards = [
    { label: 'محصول یکتا', value: fmt(totalProducts), icon: '📦', bg: 'bg-blue-50' },
    { label: 'واریانت کل', value: fmt(totalVariants), icon: '🧩', bg: 'bg-violet-50' },
    { label: 'واریانت فروخته‌شده', value: fmt(soldVariants), icon: '✅', bg: 'bg-emerald-50' },
    { label: 'تعداد فروش کل', value: fmt(totalQty), icon: '🛒', bg: 'bg-amber-50' },
    { label: 'درآمد کل', value: fmtMoney(totalRev), icon: '💰', bg: 'bg-rose-50' },
  ];

  const el = document.getElementById('kpiCards');
  el.innerHTML = '';
  cards.forEach(c => {
    const div = document.createElement('div');
    div.className = `card bg-white rounded-2xl border border-slate-100 p-4 shadow-sm ${c.bg}`;
    div.innerHTML = `
      <div class="flex items-start justify-between">
        <div>
          <p class="text-xs font-medium opacity-70 mb-1">${escapeHtml(c.label)}</p>
          <p class="text-lg font-bold leading-tight">${escapeHtml(c.value)}</p>
        </div>
        <span class="text-2xl">${c.icon}</span>
      </div>`;
    el.appendChild(div);
  });
}

function truncateLabel(name, max = 18) {
  if (!name || name.length <= max) return name;
  return name.slice(0, max - 1) + '…';
}

function renderCharts() {
  // Use filtered products so charts match the table
  const filtered = getFilteredProducts();
  const topQty = [...filtered].sort((a,b) => b.totalQty - a.totalQty).slice(0, 10).filter(p => p.totalQty > 0);
  const topRev = [...filtered].sort((a,b) => b.totalRev - a.totalRev).slice(0, 10).filter(p => p.totalRev > 0);

  const opts = {
    indexAxis: 'y',
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: {
        callbacks: {
          title: (items) => {
            const i = items[0]?.dataIndex;
            return items[0]?.chart.data.fullLabels?.[i] || items[0]?.label || '';
          },
          label: (ctx) => fmt(ctx.raw)
        }
      }
    },
    scales: {
      x: {
        ticks: { font: { family: 'Vazirmatn', size: 10 }, callback: v => fmt(v) },
        grid: { color: '#f1f5f9' }
      },
      y: {
        ticks: { font: { family: 'Vazirmatn', size: 10 }, autoSkip: false },
        grid: { display: false }
      }
    }
  };

  if (chartQty) chartQty.destroy();
  if (chartRev) chartRev.destroy();

  chartQty = new Chart(document.getElementById('chartQty'), {
    type: 'bar',
    data: {
      labels: topQty.map(p => truncateLabel(p.name)),
      fullLabels: topQty.map(p => p.name),
      datasets: [{ data: topQty.map(p => p.totalQty), backgroundColor: '#0ea5e9', borderRadius: 6, barThickness: 14 }]
    },
    options: opts
  });

  chartRev = new Chart(document.getElementById('chartRev'), {
    type: 'bar',
    data: {
      labels: topRev.map(p => truncateLabel(p.name)),
      fullLabels: topRev.map(p => p.name),
      datasets: [{ data: topRev.map(p => p.totalRev), backgroundColor: '#f43f5e', borderRadius: 6, barThickness: 14 }]
    },
    options: {
      ...opts,
      scales: {
        ...opts.scales,
        x: {
          ...opts.scales.x,
          ticks: { ...opts.scales.x.ticks, callback: v => (v >= 1000 ? (v/1000) + 'k' : fmt(v)) }
        }
      }
    }
  });
}

function materialBadgeClass(m) {
  if (!m) return 'bg-violet-100 text-violet-700';
  if (m.includes('سفید')) return 'bg-slate-200 text-slate-700';
  if (m.includes('شفاف')) return 'bg-sky-100 text-sky-700';
  if (m === 'برش') return 'bg-orange-100 text-orange-700';
  if (m === 'کیبورد') return 'bg-indigo-100 text-indigo-700';
  return 'bg-violet-100 text-violet-700';
}

function renderTable() {
  const container = document.getElementById('tableContainer');
  if (currentView === 'grouped') {
    const list = getFilteredProducts();
    document.getElementById('resultCount').textContent = `${fmt(list.length)} محصول`;

    if (!list.length) {
      container.innerHTML = `<div class="p-12 text-center text-slate-400">موردی یافت نشد</div>`;
      return;
    }

    let html = `<table class="w-full text-sm">
      <thead class="bg-slate-50 sticky top-0 z-10">
        <tr class="text-slate-500 text-xs">
          <th class="text-right py-3 px-4 font-semibold">محصول</th>
          <th class="text-center py-3 px-3 font-semibold">واریانت</th>
          <th class="text-center py-3 px-3 font-semibold">فروش</th>
          <th class="text-center py-3 px-3 font-semibold">درآمد</th>
          <th class="text-center py-3 px-3 font-semibold">قیمت</th>
          <th class="text-right py-3 px-4 font-semibold">جزئیات</th>
        </tr>
      </thead>
      <tbody>`;

    list.forEach((p) => {
      const priceRange = p.minPrice === p.maxPrice
        ? (p.maxPrice ? fmtMoney(p.maxPrice) : '—')
        : `${fmt(p.minPrice)} – ${fmt(p.maxPrice)}`;
      const soldBadge = p.totalQty > 0
        ? `<span class="badge bg-emerald-100 text-emerald-700">${fmt(p.totalQty)} فروش</span>`
        : `<span class="badge bg-slate-100 text-slate-500">بدون فروش</span>`;

      const variantsHtml = p.variants.map(v => `
        <div class="flex flex-wrap items-center gap-2 text-xs bg-slate-50 rounded-lg px-3 py-1.5">
          <span class="badge ${materialBadgeClass(v.material)}">${escapeHtml(v.material)}</span>
          <span class="badge bg-amber-50 text-amber-800">${escapeHtml(v.size)}</span>
          <span class="text-slate-500">قیمت: ${v.price ? fmtMoney(v.price) : '—'}</span>
          <span class="font-semibold ${v.qty ? 'text-emerald-600' : 'text-slate-400'}">${v.qty ? fmt(v.qty) + ' عدد' : '۰'}</span>
          ${v.total ? `<span class="text-slate-600">= ${fmtMoney(v.total)}</span>` : ''}
        </div>
      `).join('');

      html += `
        <tr class="table-row border-t border-slate-50 fade-in">
          <td class="py-3 px-4">
            <details>
              <summary class="flex items-center gap-2">
                <span class="chevron text-slate-400 text-xs">▶</span>
                <span class="font-medium text-slate-800">${escapeHtml(p.name)}</span>
                ${soldBadge}
              </summary>
              <div class="mt-2 mr-5 space-y-1.5 pb-2">${variantsHtml}</div>
            </details>
          </td>
          <td class="text-center py-3 px-3 text-slate-600">${fmt(p.variants.length)}</td>
          <td class="text-center py-3 px-3 font-semibold ${p.totalQty ? 'text-emerald-600' : 'text-slate-400'}">${fmt(p.totalQty)}</td>
          <td class="text-center py-3 px-3 font-medium text-slate-700">${p.totalRev ? fmtMoney(p.totalRev) : '—'}</td>
          <td class="text-center py-3 px-3 text-slate-600 text-xs">${priceRange}</td>
          <td class="py-3 px-4 text-xs text-slate-500">${escapeHtml(p.materials.slice(0,3).join(' · '))}${p.materials.length > 3 ? '…' : ''}</td>
        </tr>`;
    });

    html += `</tbody></table>`;
    container.innerHTML = html;
  } else {
    const list = getFilteredFlat();
    document.getElementById('resultCount').textContent = `${fmt(list.length)} واریانت`;

    if (!list.length) {
      container.innerHTML = `<div class="p-12 text-center text-slate-400">موردی یافت نشد</div>`;
      return;
    }

    let html = `<table class="w-full text-sm">
      <thead class="bg-slate-50 sticky top-0 z-10">
        <tr class="text-slate-500 text-xs">
          <th class="text-right py-3 px-4 font-semibold">محصول</th>
          <th class="text-center py-3 px-3 font-semibold">جنس</th>
          <th class="text-center py-3 px-3 font-semibold">سایز</th>
          <th class="text-center py-3 px-3 font-semibold">قیمت</th>
          <th class="text-center py-3 px-3 font-semibold">فروش</th>
          <th class="text-center py-3 px-3 font-semibold">مجموع</th>
        </tr>
      </thead>
      <tbody>`;

    list.forEach(v => {
      html += `
        <tr class="table-row border-t border-slate-50 fade-in">
          <td class="py-2.5 px-4 font-medium text-slate-800">${escapeHtml(v.name)}</td>
          <td class="text-center py-2.5 px-3"><span class="badge ${materialBadgeClass(v.material)}">${escapeHtml(v.material)}</span></td>
          <td class="text-center py-2.5 px-3 text-xs text-slate-600">${escapeHtml(v.size)}</td>
          <td class="text-center py-2.5 px-3 text-slate-700">${v.price ? fmtMoney(v.price) : '—'}</td>
          <td class="text-center py-2.5 px-3 font-semibold ${v.qty ? 'text-emerald-600' : 'text-slate-400'}">${fmt(v.qty)}</td>
          <td class="text-center py-2.5 px-3 text-slate-700">${v.total ? fmtMoney(v.total) : '—'}</td>
        </tr>`;
    });

    html += `</tbody></table>`;
    container.innerHTML = html;
  }
}

function renderAll() {
  renderKPIs();
  renderCharts();
  renderTable();
}

function refreshView() {
  renderCharts();
  renderTable();
}

// ========== File handling ==========
function handleFile(file) {
  if (!file) return;
  showLoading(true);
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      parseWorkbook(wb, file.name);
    } catch (err) {
      showError('خطا در خواندن فایل: ' + (err.message || err) + '\nمطمئن شوید فایل اکسل معتبر است و ستون‌های استاندارد دارد.');
      console.error(err);
    } finally {
      showLoading(false);
    }
  };
  reader.onerror = () => {
    showError('خطا در خواندن فایل از دیسک.');
    showLoading(false);
  };
  reader.readAsArrayBuffer(file);
}

// ========== Events ==========
document.getElementById('fileInput').addEventListener('change', e => handleFile(e.target.files[0]));
document.getElementById('fileInput2').addEventListener('change', e => handleFile(e.target.files[0]));

// Drag & drop
const dropZone = document.getElementById('dropZone');
['dragenter','dragover'].forEach(ev => {
  dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add('border-brand-500','bg-brand-50'); });
});
['dragleave','drop'].forEach(ev => {
  dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.remove('border-brand-500','bg-brand-50'); });
});
dropZone.addEventListener('drop', e => {
  const file = e.dataTransfer.files[0];
  if (file) handleFile(file);
});

// Filters → refresh charts + table
['searchInput','filterMaterial','filterSize','minPrice','maxPrice','sortBy','onlySold'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('input', refreshView);
  el.addEventListener('change', refreshView);
});

document.getElementById('resetFilters').addEventListener('click', () => {
  document.getElementById('searchInput').value = '';
  document.getElementById('filterMaterial').value = '';
  document.getElementById('filterSize').value = '';
  document.getElementById('minPrice').value = '';
  document.getElementById('maxPrice').value = '';
  document.getElementById('sortBy').value = 'qty-desc';
  document.getElementById('onlySold').checked = true;
  refreshView();
});

// View toggle
document.getElementById('viewGrouped').addEventListener('click', () => {
  currentView = 'grouped';
  document.getElementById('viewGrouped').classList.add('bg-white','shadow','font-medium','text-brand-700');
  document.getElementById('viewGrouped').classList.remove('text-slate-600');
  document.getElementById('viewFlat').classList.remove('bg-white','shadow','font-medium','text-brand-700');
  document.getElementById('viewFlat').classList.add('text-slate-600');
  renderTable();
});
document.getElementById('viewFlat').addEventListener('click', () => {
  currentView = 'flat';
  document.getElementById('viewFlat').classList.add('bg-white','shadow','font-medium','text-brand-700');
  document.getElementById('viewFlat').classList.remove('text-slate-600');
  document.getElementById('viewGrouped').classList.remove('bg-white','shadow','font-medium','text-brand-700');
  document.getElementById('viewGrouped').classList.add('text-slate-600');
  renderTable();
});

// Export helpers
function getExportData() {
  if (currentView === 'grouped') {
    const list = getFilteredProducts();
    return {
      headers: ['محصول', 'تعداد واریانت', 'فروش کل', 'درآمد کل', 'کمترین قیمت', 'بیشترین قیمت'],
      rows: list.map(p => [p.name, p.variants.length, p.totalQty, p.totalRev, p.minPrice, p.maxPrice])
    };
  }
  const list = getFilteredFlat();
  return {
    headers: ['محصول', 'جنس', 'سایز', 'قیمت', 'فروش', 'مجموع'],
    rows: list.map(v => [v.name, v.material, v.size, v.price, v.qty, v.total])
  };
}

document.getElementById('exportCsvBtn').addEventListener('click', () => {
  const { headers, rows } = getExportData();
  let csv = '\uFEFF' + headers.join(',') + '\n';
  rows.forEach(r => {
    csv += r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',') + '\n';
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'sticker-export.csv';
  a.click();
});

document.getElementById('exportXlsxBtn').addEventListener('click', () => {
  const { headers, rows } = getExportData();
  const wsData = [headers, ...rows];
  const ws = XLSX.utils.aoa_to_sheet(wsData);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'خروجی');
  XLSX.writeFile(wb, 'sticker-export.xlsx');
});

// Keyboard shortcut
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'SELECT') {
    e.preventDefault();
    document.getElementById('searchInput')?.focus();
  }
});
